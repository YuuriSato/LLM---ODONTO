name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      APP_ENV: production
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/check_private_files.py
  frontend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      WEB_PORT: 9090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        shell: bash
        run: |
          mkdir -p logs
          node tests/ui_smoke.cjs
